</style>

<!-- three-3d:start v1 -->
<style>
  .hero-3d { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  .hero-3d.on { opacity: 0.9; }
  .hero-3d canvas { width: 100% !important; height: 100% !important; display: block; }
  @media (max-width: 640px) { .hero-3d.on { opacity: 0.45; } }
</style>
<script type="module">
  // Hero background in 3D (three.js): a slowly turning globe of points joined
  // to their nearest neighbours — one node per skill the projects cover. It
  // leans toward the pointer, pauses when scrolled away, and holds still for
  // anyone who asked for reduced motion.
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js';
  const hero = document.querySelector('header.hero');
  if (hero) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' }); } catch { renderer = null; }
    if (renderer) {
      const box = document.createElement('div'); box.className = 'hero-3d'; box.setAttribute('aria-hidden', 'true');
      box.appendChild(renderer.domElement);
      hero.insertBefore(box, hero.querySelector('.hero-inner'));
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 50); camera.position.z = 6;
      const accent = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb');
      const violet = new THREE.Color('#7c3aed');
      // Fibonacci sphere: evenly spread points
      const N = 150, R = 2.3, pts = [];
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), a = i * Math.PI * (3 - Math.sqrt(5));
        pts.push(new THREE.Vector3(Math.cos(a) * r * R, y * R, Math.sin(a) * r * R));
      }
      const pg = new THREE.BufferGeometry().setFromPoints(pts);
      const colors = new Float32Array(N * 3);
      pts.forEach((p, i) => { const c = accent.clone().lerp(violet, (p.y / R + 1) / 2); colors.set([c.r, c.g, c.b], i * 3); });
      pg.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const globe = new THREE.Group();
      globe.add(new THREE.Points(pg, new THREE.PointsMaterial({ size: 0.07, vertexColors: true, transparent: true, opacity: 0.95 })));
      const seg = [];
      for (let i = 0; i < N; i++) {
        const near = pts.map((p, j) => [p.distanceTo(pts[i]), j]).filter(([, j]) => j > i).sort((a, b) => a[0] - b[0]).slice(0, 3);
        for (const [, j] of near) seg.push(pts[i], pts[j]);
      }
      globe.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg), new THREE.LineBasicMaterial({ color: accent, transparent: true, opacity: 0.22 })));
      globe.position.x = 2.2;
      scene.add(globe);
      const fit = () => {
        const w = hero.clientWidth, h = hero.clientHeight; if (!w || !h) return;
        renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
        globe.position.x = w < 720 ? 0 : 2.9; globe.scale.setScalar(w < 720 ? 0.8 : 0.92);
      };
      new ResizeObserver(fit).observe(hero); fit();
      const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
      addEventListener('pointermove', (e) => { tilt.tx = (e.clientY / innerHeight - 0.5) * 0.4; tilt.ty = (e.clientX / innerWidth - 0.5) * 0.6; }, { passive: true });
      let raf = 0, visible = true;
      function frame() {
        raf = 0;
        if (!visible || document.hidden) return;
        if (!reduce) raf = requestAnimationFrame(frame);
        tilt.x += (tilt.tx - tilt.x) * 0.05; tilt.y += (tilt.ty - tilt.y) * 0.05;
        globe.rotation.y += reduce ? 0 : 0.0016;
        globe.rotation.x = tilt.x; globe.rotation.z = tilt.y * 0.3;
        renderer.render(scene, camera);
      }
      new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !raf) raf = requestAnimationFrame(frame); }).observe(hero);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && visible && !raf) raf = requestAnimationFrame(frame); });
      raf = requestAnimationFrame(() => { frame(); box.classList.add('on'); });
    }
  }
</script>
<!-- three-3d:end -->
<!-- motion-kit:body v1 -->
<script src="https://cdn.jsdelivr.net/npm/motion@13.4.4/dist/motion.js" defer crossorigin="anonymous"></script>
<script>
/* Motion layer (motion.dev, the library behind Framer Motion), built from the
   same component ideas as the Magic UI set on 21st.dev: Blur Fade reveals, a
   Number Ticker for changing figures, a press spring for buttons and an
   animated list for new results. Progressive: without the library, or with
   reduced motion, the page is exactly as before. */
(function () {
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.documentElement;
  var EASE = [0.16, 1, 0.3, 1];
  function keepPrimaryColour() {
    document.querySelectorAll('button.primary, .btn.primary').forEach(function (b) {
      var bg = getComputedStyle(b).backgroundImage;
      if (bg && bg !== 'none') { b.style.setProperty('--mk-primary-bg', bg); b.setAttribute('data-mk-bg', ''); }
    });
  }
  function start() {
    keepPrimaryColour();
    var M = window.Motion;
    if (reduce || !M || !M.animate) { root.classList.remove('mk-pre'); return; }
    var animate = M.animate, inView = M.inView, stagger = M.stagger;
    var seen = new WeakSet();
    function blurFade(el, delay) {
      // Elements that already have a CSS entrance animation keep it; running
      // both made them fade in, vanish and fade in again.
      if (seen.has(el) || (el.className && /\banimate-in\b/.test(el.className)) || getComputedStyle(el).animationName !== 'none') return;
      seen.add(el);
      el.style.opacity = '0';
      animate(el, { opacity: [0, 1], transform: ['translateY(14px)', 'translateY(0px)'], filter: ['blur(6px)', 'blur(0px)'] },
        { duration: 0.6, delay: delay || 0, ease: EASE }).finished.then(function () { el.style.filter = ''; el.style.transform = ''; });
    }
    // 1. Blur Fade: header first, then each card as it scrolls into view.
    var top = document.querySelectorAll('header.top, header.hero .hero-inner > *, .page-head');
    top.forEach(function (el, i) { blurFade(el, i * 0.06); });
    var cards = document.querySelectorAll('main section, section.card, .card, .cards > li, [data-reveal]');
    var inFirstScreen = [];
    cards.forEach(function (el) {
      if (el.closest('header') || el.parentElement && el.parentElement.closest('.card')) return;
      var r = el.getBoundingClientRect();
      if (r.top < innerHeight) inFirstScreen.push(el);
      else if (getComputedStyle(el).animationName === 'none') { el.style.opacity = '0'; inView(el, function () { blurFade(el, 0); }, { amount: 0.12 }); }
    });
    inFirstScreen.forEach(function (el, i) { blurFade(el, 0.12 + i * 0.07); });
    root.classList.remove('mk-pre');

    // 2. Number Ticker: figures in stat tiles count to their new value.
    var NUM = /-?\d[\d,]*(?:\.\d+)?/;
    function tick(el, from, to, text) {
      var m = text.match(NUM), dec = (m[0].split('.')[1] || '').length, pre = text.slice(0, m.index), post = text.slice(m.index + m[0].length);
      var comma = m[0].indexOf(',') >= 0;
      el.__mkLock = true;
      if (el.__mkAnim) el.__mkAnim.stop();
      el.__mkAnim = animate(from, to, { duration: 0.8, ease: EASE, onUpdate: function (v) {
        var s = comma ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec);
        el.textContent = pre + s + post;
      } });
      el.__mkAnim.finished.then(function () { el.textContent = text; el.__mkLock = false; });
    }
    function num(t) { var m = t && t.match(NUM); return m ? parseFloat(m[0].replace(/,/g, '')) : null; }
    var tickers = document.querySelectorAll('.stat .v, .stats .v, .stat-value, [data-ticker]');
    tickers.forEach(function (el) {
      el.__mkLast = num(el.textContent);
      new MutationObserver(function () {
        if (el.__mkLock) return;
        var text = el.textContent, to = num(text), from = el.__mkLast;
        el.__mkLast = to;
        if (to === null || from === null || from === to || el.children.length) return;
        tick(el, from, to, text);
      }).observe(el, { childList: true, characterData: true, subtree: true });
    });

    // 3. Press spring on every button.
    document.addEventListener('pointerdown', function (e) {
      var b = e.target.closest && e.target.closest('button, .btn, [role="button"]');
      if (b && !b.disabled) animate(b, { transform: ['scale(1)', 'scale(0.96)', 'scale(1)'] }, { duration: 0.28, ease: EASE });
    }, { passive: true });

    // 4. Animated list: new results slide in instead of popping.
    var lists = document.querySelectorAll('main ul, main ol, main tbody, .results, [data-animate-list]');
    lists.forEach(function (list) {
      new MutationObserver(function (muts) {
        var added = [];
        muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1 && added.length < 24) added.push(n); }); });
        if (added.length) animate(added, { opacity: [0, 1], transform: ['translateY(8px)', 'translateY(0px)'] }, { duration: 0.35, delay: stagger(0.03), ease: EASE });
      }).observe(list, { childList: true });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<!-- /motion-kit:body -->
</body>
