<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umer Hashmi — Projects</title>
<meta name="description" content="Projects by Umer Hashmi: security tooling, machine learning, data analysis and applications. Every project has tests, CI and a README with real output.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Umer Hashmi — Projects">
<meta property="og:description" content="Security tooling, machine learning and applications that hold up under test.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
  <style>
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:focus-visible {
  outline: 2px solid var(--accent, #2563eb);
  outline-offset: 2px;
}
</style>
</head>
<body>
  <noscript><p style="margin:16px;padding:12px 16px;border-radius:8px;background:#fff7ed;color:#9a3412;border:1px solid #fdba74;font-family:system-ui,sans-serif">This interactive demo requires JavaScript. Please enable it to run the demo in your browser.</p></noscript>

  <a class="skip-link" href="#main">Skip to content</a>

<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#projects">Skip to projects</a>

<header class="hero">
  <div class="mesh" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>
  <div class="wrap hero-inner">
    <p class="eyebrow">Portfolio</p>
    <h1 id="site-name">Umer Hashmi</h1>
    <p class="tagline" id="site-tagline"></p>
    <p class="intro" id="site-intro"></p>
    <nav class="links" aria-label="Elsewhere">
      <a class="btn primary" href="https://github.com/umer-78">GitHub profile</a>
      <a class="btn" href="#projects">Browse projects</a>
    </nav>
    <dl class="stats" id="stats" aria-label="At a glance"></dl>
  </div>
</header>

<main id="main" class="wrap">
  <section class="controls" aria-label="Filter projects">
    <div class="search">
      <label for="q">Search</label>
      <div class="search-field">
        <input id="q" type="search" placeholder="Try &quot;python&quot;, &quot;retrieval&quot;, &quot;kanban&quot;" autocomplete="off" spellcheck="false">
        <kbd class="kbd" aria-hidden="true">/</kbd>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
  </section>

  <p class="count" id="count" role="status" aria-live="polite"></p>

  <div id="projects"></div>
  <ul class="cards" id="cards" data-cards></ul>

  <p class="empty" id="empty" hidden>Nothing matches that. <button class="linkish" id="clear" type="button">Clear the filters</button></p>
</main>

<footer class="wrap foot">
  <p>Built as a plain page — no framework, no build step. <a href="https://github.com/umer-78/umer-78.github.io">Source</a>.</p>
</footer>

<script type="module" src="scripts/app.js"></script>
</body>
</html>
